<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Auto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <div>
      <h1>Grand Auto</h1>
      <p>Bem Vindo a nossa garagem de luxo</p>
    </div>
    
  </header>

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="produtos.html">Produtos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contato.html">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <div class="container my-5">
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
            aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
            aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
            aria-label="Slide 3"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"
            aria-label="Slide 4"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="4"
            aria-label="Slide 5"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="5"
            aria-label="Slide 6"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="img/svj.jpg" class="d-block w-100" alt="Modelos Premium">
          </div>
          <div class="carousel-item">
            <img src="img/fordgt.jpg" class="d-block w-100" alt="Exclusivos">
          </div>
          <div class="carousel-item">
            <img src="img/gt500.jpeg" class="d-block w-100" alt="Ofertas Especiais">
          </div>
          <div class="carousel-item">
            <img src="img/Koenigsegg.jpg" class="d-block w-100" alt="Ofertas Especiais">
          </div>
          <div class="carousel-item">
            <img src="img/rs6.jpeg" class="d-block w-100" alt="Ofertas Especiais">
          </div>
          <div class="carousel-item">
            <img src="img/revuelto.jpeg" class="d-block w-100" alt="Lamborghini Revuelto">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <section class="galeria mt-5">
        <h2 class="section-title text-center mb-4">Galeria de carros</h2>
        <div class="row g-4">
          <div class="col-sm-6 col-lg-4">
            <figure class="card-galeria">
              <img src="img/svj.jpg" alt="Lamborghini" class="img-fluid">
              <figcaption>Lamborghini - design esportivo e exclusivo.</figcaption>
            </figure>
          </div>
          <div class="col-sm-6 col-lg-4">
            <figure class="card-galeria">
              <img src="img/fordgt.jpg" alt="Ford GT" class="img-fluid">
              <figcaption>Ford GT - potência e estilo em cada curva.</figcaption>
            </figure>
          </div>
          <div class="col-sm-6 col-lg-4">
            <figure class="card-galeria">
              <img src="img/gt500.jpeg" alt="Shelby GT500" class="img-fluid">
              <figcaption>Shelby GT500 - velocidade e agressividade.</figcaption>
            </figure>
          </div>
          <div class="col-sm-6 col-lg-4">
            <figure class="card-galeria">
              <img src="img/Koenigsegg.jpg" alt="Koenigsegg" class="img-fluid">
              <figcaption>Koenigsegg - luxo extremo e tecnologia de ponta.</figcaption>
            </figure>
          </div>
          <div class="col-sm-6 col-lg-4">
            <figure class="card-galeria">
              <img src="img/rs6.jpeg" alt="Audi RS6" class="img-fluid">
              <figcaption>Audi RS6 - performance dinâmica para o dia a dia.</figcaption>
            </figure>
          </div>
          <div class="col-sm-6 col-lg-4">
            <figure class="card-galeria">
              <img src="img/revuelto.jpeg" alt="Lamborghini Revuelto" class="img-fluid">
              <figcaption>Lamborghini Revuelto - inovação híbrida e potência extrema.</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div>
      <p><strong>Grand Auto - Concessionária de Carros Luxo</strong></p>
      <p>📞 (31) 3333-4444 | 📧 contato@grandauto.com.br</p>
      <p>&copy; 2026 Grand Auto. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
